function fmt(v){
  if(v===null||v===undefined) return '<span class="muted">—</span>';
  if(typeof v==='boolean') return v?'是':'否';
  if(typeof v==='number') return Number.isFinite(v)?v.toLocaleString('zh-CN',{maximumFractionDigits:4}):ESC(v);
  if(typeof v==='string'){ if(/^https?:\/\//.test(v)) return `<a href="${ESC(v)}" target="_blank" rel="noreferrer">${ESC(v)}</a>`; return ESC(v); }
  if(Array.isArray(v)){
    if(!v.length) return '<span class="muted">—</span>';
    if(v.every(x=>x===null||typeof x!=='object')) return `<div>${v.map(x=>`<span class="chip">${fmt(x)}</span>`).join('')}</div>`;
    if(v.every(x=>x&&typeof x==='object'&&!Array.isArray(x))) return table(v);

  }

function table(rows){
  const cols=[]; const seen=new Set();
  for(const r of rows) for(const k of Object.keys(r||{})) if(!seen.has(k)){seen.add(k);cols.push(k);}
  const head=cols.map(c=>`<th>${ESC(c)}</th>`).join('');
  const body=rows.map(r=>`<tr>${cols.map(c=>{
    const v=r?.[c]; const num=typeof v==='number'||(!isNaN(parseFloat(v))&&isFinite(v)&&String(v).trim()!=='');
    return `<td class="${num?'num':''}">${fmt(v)}</td>`;

function obj(v){
  const es=Object.entries(v||{}); if(!es.length) return '<span class="muted">—</span>';

}
function spark(curve){
  const a=Array.isArray(curve?.equity)?curve.equity.map(Number).filter(Number.isFinite):[];
  if(a.length<2) return '';
  const w=640,h=72,lo=Math.min(...a),hi=Math.max(...a),span=hi-lo||1;

  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#60b3ff" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}
function card(p){
  const facts=p.facts||{};

    if(k==='equity_curve') return '';
    return `<div class="fact"><dt>${ESC(k)}</dt><dd>${fmt(v)}</dd></div>`;
  }).join('');
  const caveats=(p.caveats||[]).map(c=>`<p class="caveat">${ESC(c)}</p>`).join('');
  const cls=p.status==='ok'?'ok':p.status==='error'?'error':p.status==='stale'?'stale':'warn';
  return `<section class="card"><h3><span class="dot ${cls}"></span>${ESC(p.title||p.name||'面板')}<span class="tag">${ESC(p.status||'')}</span></h3>${p.asof?`<p class="asof">截至 ${ESC(p.asof)}</p>`:''}${p.summary?`<p class="summary">${ESC(p.summary)}</p>`:''}${spark(facts.equity_curve)}${rows?`<dl class="facts">${rows}</dl>`:'<p class="empty">无 facts</p>'}${caveats}</section>`;
}
function render(snapshot){
  const panels=Array.isArray(snapshot?.panels)?snapshot.panels:[];
  const map=new Map(panels.map(p=>[p.name,p]));
  const used=new Set(); let out='';
  for(const [title,kick,names] of SECTION_DEFS){
    const ps=names.map(n=>map.get(n)).filter(Boolean); if(!ps.length) continue;
    ps.forEach(p=>used.add(p.name));
    out+=`<div class="section"><h2>${ESC(title)}</h2><span class="kick">${kick}</span></div><div class="grid">${ps.map(card).join('')}</div>`;
  }
  const rest=panels.filter(p=>!used.has(p.name));
  if(rest.length) out+=`<div class="section"><h2>其他</h2><span class="kick">OTHER</span></div><div class="grid">${rest.map(card).join('')}</div>`;
  document.getElementById('root').innerHTML=out||'<p class="empty">没有面板数据</p>';
  const ok=panels.filter(p=>p.status==='ok').length, bad=panels.length-ok;
  document.getElementById('statusline').textContent=`${panels.length} 项面板 · ${ok} 正常${bad?` · ${bad} 需关注`:''} · 数据 ${snapshot.iso||'—'}`;
  document.getElementById('statusdot').className='dot '+(bad?'warn':'ok');
  document.getElementById('updated').textContent='更新于 '+(snapshot.iso||new Date().toLocaleTimeString());
}
async function load(){
  const dot=document.getElementById('statusdot'); dot.className='dot stale';
  try{
    const r=await fetch('/api/panels?ts='+Date.now(),{cache:'no-store'});
    if(r.status===401){ location.reload(); return; }
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json(); render(d); 
  }catch(e){ document.getElementById('statusline').textContent='读取失败：'+e.message; dot.className='dot error'; }
}

function b64bytes(s){const raw=atob(s);const out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out;}
async function decryptSnapshot(password){
  const enc=new TextEncoder();
  const material=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64bytes(CIPHER.salt),iterations:CIPHER.iter,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64bytes(CIPHER.iv)},key,b64bytes(CIPHER.ct));
  return JSON.parse(new TextDecoder().decode(clear));
}
async function showStaticGate(){
  const gate=document.getElementById('gate');
  const form=document.getElementById('unlock');
  const err=document.getElementById('gateErr');
  form.addEventListener('submit',async (e)=>{
    e.preventDefault(); err.textContent='';
    try{
      const data=await decryptSnapshot(document.getElementById('pw').value);
      window.__PANEL_SNAPSHOT__=data;
      gate.remove();
      render(data);
      document.getElementById('refresh').onclick=()=>render(window.__PANEL_SNAPSHOT__);
    }catch(_e){ err.textContent='密码不正确，或快照损坏。'; }
  });
}
showStaticGate();
